{{- if eq .Values.mode "claim" }}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agent-sandbox-bench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.warmPoolReplicas }}
  sandboxTemplateRef:
    name: {{ .Release.Name }}
{{- end }}
